[project]
name = "otlab8"
version = "0.1.0"
description = "Lightweight, reproducible experiments for Assignment 8: Optimize Anything"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.9,<4",
  "networkx>=3.3,<4",
  "numpy>=2.1,<3",
  "pennylane>=0.40,<1",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "torch>=2.5,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
